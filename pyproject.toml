[project]
name = "langchain-multi-agent-system"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anand Vadgama", email = "vadgamaanand6@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "langchain>=1.4.3",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.6",
    "langchain-groq>=1.1.3",
    "lxml>=6.1.3",
    "python-dotenv>=1.2.4",
    "readability-lxml>=0.9",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "streamlit>=1.65.0",
    "tavily-python>=0.8.4",
    "trafilatura>=2.3.0",
]

[project.scripts]
langchain-multi-agent-system = "langchain_multi_agent_system:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
